version: '3.8'

services:
  web:
    build: . # this tells docker Compose to look for our dockerfile (nginx) allowing us to use a custom image 
    container_name: nginx-php
    ports:
      - "5000:5000"
    volumes:
      - ./app:/var/www/html
      # linux
      - ~/workspace/designintoto/git/Framework/DDMB-Framework/P4 Dev/assets/library FLG25:/var/www/html/content
      - ./default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
    networks:
      - app-network

  php:
    image: php:8.2-fpm
    container_name: php-fpm
    volumes:
      - ./app:/var/www/html
      # so php can read and write into that volume
      - /home/hugo/workspace/designintoto/git/Framework/DDMB-Framework:/var/www/html/content
    networks:
      - app-network
    environment:
      # these values will be available 
      # // 1. Using getenv()
      # $db_host = getenv('DB_HOST');
      # // 2. Using Superglobals
      # $api_key = $_ENV['API_KEY'] ?? $_SERVER['API_KEY']; 
      - DB_HOST=db_server
      - API_KEY=secret_value_123
networks:
  app-network:
    driver: bridge