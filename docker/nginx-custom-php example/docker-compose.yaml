services:
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: php85
    volumes:
      - ./src:/var/www/html
    environment:
    # we can use key: value or key=value but if we use = it needs - before the key 
      APP_ENV: testing
      API_URL: example


  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - "10000:80"
    volumes:
      # :ro means read only
      - ./src:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php